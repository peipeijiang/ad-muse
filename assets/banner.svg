      <rect x="236" y="346" width="132" height="32" rx="16" fill="#ffffff" fill-opacity="0.10" stroke="#ff8fb1" stroke-opacity="0.6"/>
      <text x="302" y="367" text-anchor="middle">Omni Flash</text>
      <rect x="380" y="346" width="132" height="32" rx="16" fill="#ffffff" fill-opacity="0.10" stroke="#b9a4ff" stroke-opacity="0.6"/>
      <text x="446" y="367" text-anchor="middle">Local QC</text>
    </g>
