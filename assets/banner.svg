  </g>
  <path d="M866 210h44" stroke="#ffd38a" stroke-width="3" stroke-linecap="round" marker-end="url(#a)"/>
  <path d="M902 202l10 8-10 8" fill="none" stroke="#ffd38a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

