<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-label="AdMuse · 广告缪斯 — 从商品与灵感，到带货成片">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#150f2e"/>
      <stop offset="0.55" stop-color="#2a1245"/>
      <stop offset="1" stop-color="#4a1236"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffd38a"/>
      <stop offset="0.5" stop-color="#ff8fb1"/>
      <stop offset="1" stop-color="#b9a4ff"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff4c9" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#fff4c9" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff8fb1" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ff8fb1" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="screen"><rect x="0" y="0" width="150" height="266" rx="14"/></clipPath>
  </defs>
  <rect width="1280" height="420" fill="url(#bg)"/>
  <circle cx="980" cy="210" r="260" fill="url(#glow)"/>
  <g stroke="#ffffff" stroke-opacity="0.06">
