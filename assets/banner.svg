    <text x="92" y="226" font-size="38" font-weight="600" fill="#f4ecff" letter-spacing="6">广告缪斯</text>
    <text x="92" y="284" font-size="26" fill="#e3d8f5">从商品与灵感，到带货成片。</text>
    <text x="92" y="320" font-size="20" fill="#b9acd6">Turn products and inspiration into video ads.</text>
    <g font-size="15" fill="#f4ecff">
