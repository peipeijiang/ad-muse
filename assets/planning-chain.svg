<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-label="AdMuse 规划链：分镜表、故事板、白模预演、动作链条">
  <rect width="1280" height="560" rx="20" fill="#faf8ff"/>
  <text x="40" y="48" font-size="24" font-weight="700" fill="#2d2440" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,Noto Sans CJK SC,Helvetica Neue,Arial,sans-serif">先规划，再生成：每一步都留下可核对的文件</text>
  <text x="40" y="76" font-size="15" fill="#7a6f91" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,Noto Sans CJK SC,Helvetica Neue,Arial,sans-serif">四份规划产物来自同一张分镜表，跨产物一致后才写最终提示词</text>

  <!-- card 1: shot rows -->
  <g transform="translate(24 100)">
