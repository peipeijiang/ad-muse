      <text x="24" y="111">0–3s   POV 抢货  手持前冲</text>
      <text x="24" y="137">3–5s   匹配剪辑  入袋→到家</text>
      <text x="24" y="163">5–8s   装车特写  右手卡入</text>
      <text x="24" y="189">8–12s  按键近景  灯灭→灯亮</text>
      <text x="24" y="215">12–15s 夜骑全景  光照路面</text>
      <line x1="16" y1="96" x2="268" y2="96" stroke="#e4def5"/><line x1="16" y1="122" x2="268" y2="122" stroke="#e4def5"/><line x1="16" y1="148" x2="268" y2="148" stroke="#e4def5"/><line x1="16" y1="174" x2="268" y2="174" stroke="#e4def5"/><line x1="16" y1="200" x2="268" y2="200" stroke="#e4def5"/><line x1="16" y1="226" x2="268" y2="226" stroke="#e4def5"/>
    </g>
    <text x="18" y="262" font-size="14" fill="#4b4060" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,Noto Sans CJK SC,Helvetica Neue,Arial,sans-serif">轴线、走位、机位、接触点、</text>
    <text x="18" y="286" font-size="14" fill="#4b4060" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,Noto Sans CJK SC,Helvetica Neue,Arial,sans-serif">前后状态，时间首尾相接</text>
    <text x="18" y="318" font-size="13" fill="#7c3aed" font-weight="700" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,Noto Sans CJK SC,Helvetica Neue,Arial,sans-serif">唯一事实源</text>
  </g>

